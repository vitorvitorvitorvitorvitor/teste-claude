  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }

  }
  #cap em { font-style: normal; color: #ffc451; }
  #tag {
    position: absolute; right: 60px; top: 420px; font-family: Oswald, sans-serif; font-size: 34px;
    color: #fff3dc; letter-spacing: 4px; padding: 6px 18px; border: 4px solid #fff3dc; border-radius: 10px;
